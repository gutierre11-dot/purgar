[package]
name = "purgar"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Gutierrez de Souza"]
description = "Limpador de cache e arquivos temporários para Linux com TUI em Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/gutierre11-dot/purgar"
homepage = "https://github.com/gutierre11-dot/purgar"
keywords = ["cleaner", "cache", "tui", "linux", "system"]
categories = ["command-line-utilities", "system"]
exclude = [".github/", "packaging/", "docs/"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
fs2 = "0.4.3"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
unicode-width = "0.2.3"
walkdir = "2.5.0"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
